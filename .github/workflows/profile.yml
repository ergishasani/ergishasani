name: Refresh public profile

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - README.md
      - scripts/update-profile.mjs
      - scripts/update-profile.test.mjs
      - scripts/profile-visuals.mjs
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/update-profile.test.mjs
      - run: node scripts/update-profile.mjs
      - name: Save updated public data
        shell: bash
        run: |
          if ! git diff --quiet -- README.md assets; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md assets/github-dashboard.svg assets/freshclone.svg assets/myvision.svg assets/gymos.svg
            git commit -m 'docs: refresh public GitHub profile data'
            git push
          fi
