<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Ergis Hasani — Full Stack Developer</title>
  <desc id="description">A dark navy banner with teal and blue geometric details. From an idea to something people can use.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0d1117" />
      <stop offset="1" stop-color="#102838" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" />
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#background)" />
  <rect width="1200" height="360" rx="20" fill="url(#grid)" />
  <path d="M860 0 650 360M1100 0 890 360" stroke="#2dd4bf" stroke-opacity="0.08" stroke-width="80" />
  <rect x="64" y="62" width="46" height="4" rx="2" fill="url(#accent)" />
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="106" font-size="15" font-weight="600" letter-spacing="4" fill="#2dd4bf">FULL STACK DEVELOPER</text>
    <text x="60" y="190" font-size="76" font-weight="700" letter-spacing="-3" fill="#f0f6fc">Ergis Hasani<tspan fill="#2dd4bf">.</tspan></text>
    <text x="64" y="242" font-size="23" fill="#c0cdda">From an idea to something people can use.</text>
    <text x="64" y="302" font-size="15" letter-spacing="1" fill="#91a4b7">TYPESCRIPT / NEXT.JS / JAVA / DOCKER</text>
  </g>
  <g transform="translate(930 172)" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-103" y="-86" width="222" height="172" rx="22" stroke="#263f50" stroke-width="2" />
    <path d="m-39-30-32 30 32 30m96-60 32 30-32 30M24-43 0 43" />
  </g>
  <circle cx="1059" cy="77" r="6" fill="#2dd4bf" />
  <circle cx="822" cy="277" r="4" fill="#38bdf8" />
  <rect x="64" y="343" width="1072" height="2" rx="1" fill="url(#accent)" opacity="0.4" />
</svg>
